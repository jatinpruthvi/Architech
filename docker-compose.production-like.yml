services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: architech
      POSTGRES_PASSWORD: architech
      POSTGRES_DB: architech
    ports:
      - "5432:5432"
    volumes:
      - architech_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U architech -d architech"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  architech_postgres:
