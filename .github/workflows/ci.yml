name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma schema validate
        run: pnpm db:validate
      - name: Type check
        run: pnpm check
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: No-JavaScript SEO smoke tests
        run: pnpm test:seo
      # Real-HTTP end-to-end suites against the production build: auth flows in
      # both auth modes, public routes, URL grammar, SEO plumbing, security
      # headers. Reuses the build above, so this adds seconds, not minutes.
      - name: End-to-end flows
        run: pnpm test:e2e:only
      - name: Search Console config audit
        run: pnpm seo:gsc:audit
      - name: Security and legal gates
        run: pnpm security:audit
      - name: Operational readiness audit
        run: pnpm ops:audit
      - name: Phase 1 release audit
        run: pnpm release:audit
      - name: Production enablement plan audit
        run: pnpm production:plan:audit
      - name: Production provisioning audit
        run: pnpm provisioning:audit
      - name: Storybook smoke test
        run: pnpm storybook:smoke
      - name: Performance budget
        run: pnpm test:perf
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Accessibility smoke tests
        run: pnpm test:a11y
