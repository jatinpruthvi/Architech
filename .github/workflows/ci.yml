name: CI

# Least privilege, matching lighthouse.yml. This workflow only reads the repo.
permissions:
  contents: read

# A force-push or extra commit on an open PR cancels the run it supersedes
# instead of queueing a second full pass. Main-branch runs always finish, so
# history keeps a trustworthy green/red per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Bounds a hung step (browser suites and the build are the usual suspects)
    # instead of letting it idle to the 6-hour default.
    timeout-minutes: 45
    # src/lib/search/sql-page-integration.test.ts is the standing proof that the
    # SQL page path returns exactly what the JS path returns — its own header
    # calls it "the guardrail the whole rebuild depends on". It is opt-in behind
    # ARCHITECH_PARITY_DATABASE_URL, so with no database in this job all 48 of
    # its cases were skipped on every single build and the guardrail was only
    # ever run by hand.
    #
    # postgis/postgis is the image docker-compose.production-like.yml uses, so
    # migrations apply unmodified here instead of through the stubs
    # ops/scripts/sandbox/setup-local-db.mjs needs when PostGIS is absent. The
    # suite asserts indexPlan === "postgres-fts-trigram-page", so pg_trgm and
    # unaccent have to be real, not skipped.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: architech
          POSTGRES_PASSWORD: architech
          POSTGRES_DB: architech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U architech -d architech"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Single source of truth: .nvmrc. Keep it in step with package.json
          # "engines" and the Node version named in docs.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Provisions the parity database. The seed is not optional: the suite
      # resolves places through the city/locality reference rows, and without
      # them the place-resolution scenarios compare two empty answers and pass
      # for the wrong reason. Fatal on purpose — a database that half-applied
      # would quietly skip the guardrail again, which is the state this exists
      # to end.
      - name: Apply database schema and seed
        env:
          DATABASE_URL: 'postgresql://architech:architech@localhost:5432/architech?schema=public'
        run: |
          pnpm db:generate
          pnpm db:migrate
          pnpm db:seed
      - name: Prisma schema validate
        run: pnpm db:validate
      - name: Type check
        run: pnpm check
      - name: Lint
        run: pnpm lint
      # Resolves every bg-*/text-* pairing in the markup through the real token
      # values, per interaction state and per theme, and computes the WCAG
      # ratio. Catches "these two colours do not contrast", which the
      # token-level tests cannot see.
      - name: Surface contrast audit
        run: pnpm audit:contrast
      # ARCHITECH_PARITY_DATABASE_URL is what switches the search parity matrix
      # from describe.skip to describe — see the `services:` block above. The
      # suite provisions its own rows, so this needs nothing beyond the schema
      # and the reference seed applied earlier.
      #
      # test:report adds a JSON report for the step after this one. A vitest
      # exit code cannot tell 48 passed from 48 skipped — both are 0 — which is
      # exactly how that suite went unrun on every build while this step stayed
      # green.
      - name: Unit tests
        run: pnpm test:report
        env:
          ARCHITECH_PARITY_DATABASE_URL: 'postgresql://architech:architech@localhost:5432/architech?schema=public'
      # Reads the report above and fails if the parity matrix did not execute.
      # Asserting on the workflow text is not enough: the variable can be
      # present and still be empty, or name a database that never came up in a
      # way that skips the suite rather than failing it. This checks the
      # outcome, not the configuration.
      - name: Search parity matrix ran, not skipped
        run: pnpm test:assert-parity
      # ops/scripts tests use the Node test runner, not vitest, so `pnpm test`
      # does not reach them. This glob covers every ops suite at once, so a new
      # *.test.mjs is picked up automatically instead of needing a CI edit —
      # several suites were silently unrun before, including ones that
      # ops/config/governance already declared as required for staging and
      # production. Cheap and dependency-free, so it runs ahead of the build.
      - name: Ops script tests (node --test)
        run: pnpm ops:test
      # generate-md-index.mjs must be re-run whenever a markdown file is added
      # or moved. Enforcing it here means a stale index fails CI rather than
      # relying on the author remembering.
      #
      # This is a script, not `git diff --exit-code`. That form reports a stale
      # index and a git failure identically — one opaque non-zero exit — and its
      # only output is a raw diff with no instruction, which is how this step
      # stayed undiagnosed for four commits. The script separates "stale"
      # (exit 1) from "the check could not run" (exit 2), names the entries that
      # changed, and flags any link to a file the repository does not contain.
      - name: Documentation index is up to date
        run: pnpm docs:index:check
      # Both Evolution API compose files must stay parseable and fully
      # interpolated. Every variable carries a :- default, so this needs no .env
      # and no secrets. The whatsapp profile is the staging/production scaffold.
      - name: Compose files valid
        run: |
          docker compose -f docker-compose.whatsapp.yml config --quiet
          docker compose -f docker-compose.production-like.yml --profile whatsapp config --quiet
      - name: Production build
        run: pnpm build
      # Boots the static publisher (dist/index.js) on an ephemeral port and
      # asserts the PWA install contract against the bytes that ship — manifest
      # fields, reachable icons, a fetch-handling worker that is never
      # long-cached. Exit 1 on regression.
      - name: PWA installability audit
        run: pnpm audit:pwa:ci
      - name: No-JavaScript SEO smoke tests
        run: pnpm test:seo
      # Links-first crawl over the production build: no broken links, canonicals
      # self-reference, sitemap ⊆ crawl graph, indexable pages within click
      #-depth budget. Reuses the build above (boots `next start` itself).
      - name: Crawl simulation
        run: PUBLIC_INDEXING_ENABLED=true node ops/scripts/seo/crawl-simulation.mjs
      # Real-HTTP end-to-end suites against the production build: auth flows in
      # both auth modes, public routes, URL grammar, SEO plumbing, security
      # headers. Reuses the build above, so this adds seconds, not minutes.
      - name: End-to-end flows
        run: pnpm test:e2e:only
        env:
          BETTER_AUTH_SECRET: 'devsecret123456789012345678901234567890'
          BETTER_AUTH_URL: 'http://localhost:3000'
          DATABASE_URL: 'postgresql://architech:architech@localhost:5432/architech?schema=public'
      - name: Search Console config audit
        run: pnpm seo:gsc:audit
      - name: Security and legal gates
        run: pnpm security:audit
      - name: Operational readiness audit
        run: pnpm ops:audit
      - name: Phase 1 release audit
        run: pnpm release:audit
      - name: Production enablement plan audit
        run: pnpm production:plan:audit
      - name: Production provisioning audit
        run: pnpm provisioning:audit
      - name: Storybook smoke test
        run: pnpm storybook:smoke
      - name: Performance budget
        run: pnpm test:perf
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'])")" >> $GITHUB_ENV
      - name: Cache playwright binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Accessibility smoke tests
        run: pnpm test:a11y
        env:
          BETTER_AUTH_SECRET: 'devsecret123456789012345678901234567890'
          BETTER_AUTH_URL: 'http://localhost:3000'
          DATABASE_URL: 'postgresql://architech:architech@localhost:5432/architech?schema=public'
      - name: Visual & Devanagari layout smoke
        run: pnpm test:ui
        env:
          BETTER_AUTH_SECRET: 'devsecret123456789012345678901234567890'
          BETTER_AUTH_URL: 'http://localhost:3000'
          DATABASE_URL: 'postgresql://architech:architech@localhost:5432/architech?schema=public'
