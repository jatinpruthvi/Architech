services:
  evolution-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution-local-only
      POSTGRES_DB: evolution
    volumes:
      - architech_evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - architech_evolution_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Evolution's root route is its documented health endpoint and needs no apikey,
      # so a failure here means "still booting", never "wrong key". Probed with the
      # image's own Node runtime because the image ships no curl or wget.
      #
      # The 30s timeout is deliberate: in evolution-api 2.3.7 (cd800f2) the root
      # handler calls fetchLatestWaWebVersion(), which does an unbounded axios GET
      # to https://web.whatsapp.com/sw.js before responding. A slow upstream can
      # therefore make this route far slower than a local health probe should be.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 60s
    environment:
      SERVER_NAME: evolution
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${ARCHITECH_EVOLUTION_API_KEY:-local-development-only-change-me}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      LANGUAGE: en
      TELEMETRY_ENABLED: "false"
      PROMETHEUS_METRICS: "false"
      CORS_ORIGIN: http://localhost:3000
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: "false"
      LOG_LEVEL: ERROR,WARN
      LOG_COLOR: "false"
      LOG_BAILEYS: error
      DEL_INSTANCE: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution-local-only@evolution-postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: architech_evolution_local
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_IS_ON_WHATSAPP: "false"
      DATABASE_DELETE_MESSAGE: "true"
      RABBITMQ_ENABLED: "false"
      SQS_ENABLED: "false"
      KAFKA_ENABLED: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/1
      CACHE_REDIS_TTL: "604800"
      CACHE_REDIS_PREFIX_KEY: architech_evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBSOCKET_ENABLED: "false"
      QRCODE_LIMIT: "30"

volumes:
  architech_evolution_postgres:
    name: architech_evolution_postgres
  architech_evolution_redis:
    name: architech_evolution_redis
